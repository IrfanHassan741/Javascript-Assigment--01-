
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5 mb-5">
        <div class="card shadow mx-auto" style="max-width: 700px;">

            <div class="card-header bg-primary text-white text-center">
                <h2>Student Information</h2>
            </div>

            <div class="card-body">

                <!-- Information -->
                <h4 class="text-primary mb-3">Personal Information</h4>

                <h1 id="fullName" class="fs-5 p-2 bg-light rounded"></h1>
                <h1 id="city" class="fs-5 p-2 bg-light rounded"></h1>
                <h1 id="DOB" class="fs-5 p-2 bg-light rounded"></h1>
                <h1 id="age" class="fs-5 p-2 bg-light rounded"></h1>

                <hr>

                <!-- Marks -->
                <h4 class="text-success mb-3">Subject Marks</h4>

                <h1 id="eng" class="fs-5 alert alert-primary"></h1>
                <h1 id="urdu" class="fs-5 alert alert-success"></h1>
                <h1 id="isl" class="fs-5 alert alert-info"></h1>
                <h1 id="maths" class="fs-5 alert alert-warning"></h1>
                <h1 id="bio" class="fs-5 alert alert-secondary"></h1>

                <hr>

                <!-- Result -->
                <h4 class="text-danger mb-3">Final Result</h4>

                <h1 id="total" class="fs-4 alert alert-dark"></h1>
                <h1 id="per" class="fs-4 alert alert-success"></h1>

            </div>

            <div class="card-footer text-center text-muted">
                Student Result Card
            </div>

        </div>
    </div>

    <!-- JavaScript -->
    <script src="./information.js"></script>

</body>
</html>
