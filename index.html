
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <header class="card shadow-lg border-0 rounded-4 mx-auto"
                style="max-width: 600px;">

            <!-- Header -->
            <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">

                <h1 class="h2 fw-bold mb-2">🎓 Student Profile</h1>

                <p class="mb-0">Personal & Educational Information</p>

            </div>

            <!-- Information -->
            <div class="card-body p-4">

                <h4 class="text-primary fw-bold mb-4">
                    📋 Student Information
                </h4>

                <div class="bg-light rounded-3 p-3 mb-3">
                    <h5 class="text-secondary">Full Name</h5>
                    <h1 id="demo" class="fs-4 mb-0"></h1>
                </div>

                <div class="bg-light rounded-3 p-3 mb-3">
                    <h5 class="text-secondary">Age</h5>
                    <h1 id="age" class="fs-4 mb-0"></h1>
                </div>

                <div class="bg-light rounded-3 p-3 mb-3">
                    <h5 class="text-secondary">City</h5>
                    <h1 id="city" class="fs-4 mb-0"></h1>
                </div>

                <hr class="my-4">

                <h4 class="text-success fw-bold mb-4">
                    📚 Educational Details
                </h4>

                <div class="alert alert-primary rounded-3">
                    <h5>Course Name</h5>
                    <h1 id="CourseName" class="fs-4 mb-0"></h1>
                </div>

                <div class="alert alert-success rounded-3">
                    <h5>Institute Name</h5>
                    <h1 id="InstituteName" class="fs-4 mb-0"></h1>
                </div>

            </div>

            <!-- Footer -->
            <div class="card-footer text-center bg-white py-3">
                <p class="text-muted mb-0">
                    Student Profile | Made with Bootstrap
                </p>
            </div>

        </header>

    </div>

    <!-- JavaScript -->
    <script src="./app.js"></script>

</body>
</html>
